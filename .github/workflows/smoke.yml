name: Smoke

# Vercel reports each finished deployment back to GitHub; this checks the
# deployed site from outside, signed out, so it needs no secrets but the bypass.
on:
  deployment_status:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Smoke (${{ github.event.deployment_status.environment }})
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    # Browsers come preinstalled, as in ci.yml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      SMOKE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      # The tests come from main, never from the deployed commit: this job holds
      # the bypass secret, and a deployment's code is not trusted to run here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14

  # A failing production check opens an issue, which emails the repo owner.
  # Its own job on the plain runner, which has the gh CLI the image lacks.
  report:
    name: Report a failed production smoke test
    needs: smoke
    if: failure() && github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: >
          gh issue create --repo "$GITHUB_REPOSITORY"
          --title "carlo-app.com failed its smoke test"
          --body "The smoke test failed against $SMOKE_URL after deploying ${{ github.event.deployment.sha }}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
