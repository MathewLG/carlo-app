name: Weekly

# Runs the full CI on main every Monday at 9:00 Mexico City time (15:00 UTC),
# so a new security advisory or a broken dependency shows up between changes.
on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
